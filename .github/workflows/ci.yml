name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 自检脚本能跑
        run: python skills/g-resentation/scripts/doctor.py

      - name: 示例逐页稿能过机检
        run: python skills/g-resentation/scripts/check_outline.py skills/g-resentation/examples/minimal

      - name: 建项目 → 冻结拦截 → 留版 → 复检
        run: python tests/smoke.py
